[project]
name = "codewright-sandbox"
version = "0.0.0"
description = "Codewright sandbox runner and egress gateway (ADR 0020)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.120",
    "httpx>=0.28",
    "pydantic>=2.11",
    "pyyaml>=6",
    "uvicorn[standard]>=0.35",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codewright_sandbox"]
