name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (tag in the comment) per ADR 0006.
jobs:
  api:
    name: API (Python)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: monoshift
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: monoshift_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U monoshift"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      MONOSHIFT_TEST_DATABASE_URL: postgresql://monoshift:ci-only-password@localhost:5432/monoshift_test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.16"
      - run: uv sync --all-packages --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Audit dependencies for known vulnerabilities
        run: uv export --all-packages --no-dev --no-hashes --no-emit-workspace > /tmp/requirements.txt && uvx pip-audit -r /tmp/requirements.txt

  web:
    name: Web (Next.js)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
      - run: npm install -g pnpm@12.12.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod

  compose:
    name: Docker images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: cp .env.example .env && sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci-only-password/' .env
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Smoke test the stack
        run: |
          docker compose up -d --wait --wait-timeout 180
          curl -fsS http://127.0.0.1:8000/api/health/ready
          curl -fsS http://127.0.0.1:3000/api/projects
          curl -fsS http://127.0.0.1:3000/ | grep -q "Projects"
      - if: always()
        run: docker compose logs --no-color | tail -200 && docker compose down -v
