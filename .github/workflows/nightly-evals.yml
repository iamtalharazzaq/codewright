# Not run yet: the repository has no GitHub remote. The model-free eval checks (scoreboard, review grader, new-app
# acceptance grader, EXAMPLES.md parser) every night. The live suites need the model and the stack: `make eval-nightly`.
name: Nightly evals

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    name: Eval fixtures
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.16"
      - run: uv sync --all-packages --locked
      - run: uv run pytest agent/tests/evals -q
      - run: uv run python -m evals.scoreboard
