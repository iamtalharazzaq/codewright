# Install once: uv run pre-commit install
# Uses the repo's own pinned tools (uv / pnpm) so hooks match CI.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-toml
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^README\.md$|^PROMPT\.md$
      - id: trailing-whitespace
        exclude: ^README\.md$|^PROMPT\.md$

# Lint, types and tests run in Docker with `make check` (no host .venv or node_modules needed).
