# LLM endpoints (README Section 8). Both profiles run the same model on a llama.cpp server and are used through its
# OpenAI-compatible API, so switching between them only changes the URL.
#
# Precedence (highest first): Settings page (stored in the database) > environment variables
#   MONOSHIFT_LLM_REMOTE_GPU_URL / MONOSHIFT_LLM_LOCAL_CPU_URL > this file.
#
# Verified in Phase 0 (V1, docs/adr/0002-llm-model-qwen3-5-9b.md):
#   GGUF file:  Qwen3.5-9B-Q4_K_M.gguf (5.7 GB; run llama-server with --no-mmproj for text only)
# Secrets never go here: `api_key_env` names an environment variable instead.
profiles:
  remote_gpu:
    server: llamacpp
    base_url: null                     # not configured yet: set it in Settings when the RTX 3080 box is ready
    model: Qwen3.5-9B-Q4_K_M
    num_ctx: 16384                     # starting point; measure and tune on the RTX 3080 (docs/setup/remote-gpu.md)
    max_parallel_llm_jobs: 1
    api_key_env: MONOSHIFT_REMOTE_GPU_API_KEY
  local_cpu:
    server: llamacpp
    base_url: http://host.docker.internal:8080/v1
    model: Qwen3.5-9B-Q4_K_M
    num_ctx: 4096                      # must not exceed the server's per-slot context (llama-server -c / -np)
    max_parallel_llm_jobs: 1
    api_key_env: MONOSHIFT_LOCAL_CPU_API_KEY
embeddings:
  server: llamacpp
  base_url: http://host.docker.internal:8081/v1
  model: Qwen3-Embedding-0.6B
  dimensions: 1024
default_profile: local_cpu             # the remote GPU isn't available yet
