# Run budgets (README Section 9.2: "time/tokens/retries per run and step; pause and ask when exceeded").
# Starting values for a 9B model; measured and tuned from Phase 1 on. A run that hits a limit pauses and asks.

defaults:
  per_step:
    max_llm_calls: 20
    max_tokens: 60000          # prompt + completion
    max_minutes: 30
    max_retries: 2             # structured-output retries (Section 10, rule 3)
  per_run:
    max_tokens: 1000000
    max_hours: 12
  reflection:
    max_loops: 5               # failure → hypothesis → fix → retry, then escalate (Section 7, component 18)

# Per-tier overrides: tier-0 answers should stay small and quick.
tiers:
  0:
    per_run: { max_tokens: 60000, max_hours: 0.5 }

# Per-playbook overrides, applied after the tier's: tier-0 playbooks that read a whole project make many small calls
# (one per file chunk), so they get room for that while staying answer-only.
playbooks:
  code_review:
    per_step: { max_llm_calls: 120, max_tokens: 500000 }
    per_run: { max_tokens: 600000, max_hours: 2 }
  audit:
    per_step: { max_llm_calls: 60, max_tokens: 250000 }
    per_run: { max_tokens: 600000, max_hours: 2 }
  docs:
    per_step: { max_llm_calls: 30, max_tokens: 150000 }
    per_run: { max_tokens: 400000, max_hours: 2 }
