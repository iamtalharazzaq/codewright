# Codewright: `docker compose up` from the repo root (COMPOSE_FILE in .env points here).
# Everything binds to 127.0.0.1 only: single user, no login (README Section 11).
#
# Optional profiles:
#   docker compose --profile llamacpp-cpu up # bundled llama.cpp on CPU, serving a GGUF from MODELS_DIR
#   docker compose --profile host-llm-bridge up  # lets containers reach a llama-server bound to 127.0.0.1 on the host
#   docker compose --profile ollama-cpu up   # bundled Ollama on CPU (port 11435; your host Ollama keeps 11434)
#   docker compose --profile langfuse up     # self-hosted Langfuse (see deploy/docker-compose.langfuse.yml)
#   make check                               # profile `checks`: lint, types and tests in containers

name: codewright

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codewright}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-codewright}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: codewright-api:dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-codewright}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-codewright}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      EXTERNAL_LLM_ENABLED: ${EXTERNAL_LLM_ENABLED:-false}
      REMOTE_GPU_API_KEY: ${REMOTE_GPU_API_KEY:-}
      LOCAL_CPU_API_KEY: ${LOCAL_CPU_API_KEY:-}
      LLM_REMOTE_GPU_URL: ${LLM_REMOTE_GPU_URL:-}
      LLM_LOCAL_CPU_URL: ${LLM_LOCAL_CPU_URL:-}
      # Optional Langfuse (profile `langfuse`): traces go there too when all three are set.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      # Connectors (Phase 3): host folders are mounted at fixed container paths below.
      LOCAL_SOURCE_ROOT: /data/local-source
      OUTPUT_ROOT: /data/outputs
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SECRET_KEY: ${SECRET_KEY:-}
      GOOGLE_OAUTH_CLIENT_FILE: ${GOOGLE_OAUTH_CLIENT_FILE:+/data/google-oauth-client.json}
      PUBLIC_URL: http://localhost:${WEB_PORT:-3000}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ../config:/app/config:ro
      - workspaces:/app/workspaces
      - ${LOCAL_SOURCE_DIR:-../local-source}:/data/local-source:ro
      - ${ALLOWED_OUTPUT_DIRS:-../deliveries}:/data/outputs
      - ${GOOGLE_OAUTH_CLIENT_FILE:-/dev/null}:/data/google-oauth-client.json:ro
    extra_hosts:
      # Lets the API reach model servers on the host (local_cpu profile). See ADR 0002.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:8000
    image: codewright-web:dev
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  host-llm-bridge:
    # For a llama-server on this machine that listens on 127.0.0.1 only. Forwards the Docker bridge address
    # (what host.docker.internal resolves to) to the host's loopback, without changing the server.
    # Listens on the Docker bridge only, so nothing is exposed to the network. Skip it if your server
    # already listens on an address containers can reach.
    profiles: ["host-llm-bridge"]
    image: alpine/socat:1.8.1.1
    restart: unless-stopped
    network_mode: host
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        socat TCP-LISTEN:${HOST_LLM_PORT:-8080},bind=${DOCKER_BRIDGE_IP:-172.17.0.1},reuseaddr,fork
        TCP:127.0.0.1:${HOST_LLM_PORT:-8080} &
        exec socat TCP-LISTEN:${HOST_EMBED_PORT:-8081},bind=${DOCKER_BRIDGE_IP:-172.17.0.1},reuseaddr,fork
        TCP:127.0.0.1:${HOST_EMBED_PORT:-8081}

  llamacpp-cpu:
    profiles: ["llamacpp-cpu"]
    image: ghcr.io/ggml-org/llama.cpp:server-b9744
    restart: unless-stopped
    # The GGUF is mounted read-only from the host, never copied (models are several GB).
    volumes:
      - ${MODELS_DIR:-../models}:/models:ro
    command:
      - --model
      - /models/${GGUF_FILE:-Qwen3.5-9B-Q4_K_M.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "8192"
      - --parallel
      - "1"            # max_parallel_llm_jobs = 1
      - --no-mmproj    # text only: skip the vision projector
      - --jinja
    ports:
      - "127.0.0.1:${LLAMACPP_PORT:-8090}:8080"

  ollama-cpu:
    profiles: ["ollama-cpu"]
    image: ollama/ollama:0.40.3
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: "1"     # max_parallel_llm_jobs = 1 (README Section 8.1)
      OLLAMA_CONTEXT_LENGTH: "8192"
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11435}:11434"
    volumes:
      - ollama:/root/.ollama
    # The model is not pulled automatically (about 6.6 GB). After start:
    #   docker compose exec ollama-cpu ollama pull qwen3.5:9b-q4_K_M

  # `make check`: every lint/type/test check, in Docker. Run with `docker compose --profile checks run --rm <name>`.
  api-checks:
    profiles: ["checks"]
    build:
      context: ..
      dockerfile: deploy/checks/api.Dockerfile
    image: codewright-api-checks:dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # A throwaway database next to the app's own; it is created if missing, then migrated down/up and wiped.
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-codewright}:${POSTGRES_PASSWORD}@postgres:5432/codewright_test

  web-checks:
    profiles: ["checks"]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: check
    image: codewright-web-checks:dev

volumes:
  pgdata:
  workspaces:
  ollama:
