# Codewright Python workspace root (uv).
# The root package holds the agent runtime (`agent/`); `apps/api` is a workspace member that depends on it.
[project]
name = "codewright"
version = "0.0.0"
description = "A self-hosted AI software house in a chat app"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deepagents>=0.7",
    "httpx>=0.28",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=3.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.11",
    "pyyaml>=6",
]

[project.optional-dependencies]
langfuse = ["langfuse>=3"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "connectors"]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pre-commit>=4",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "ruff>=0.14",
    "types-pyyaml",
]

[tool.uv]
# Supply-chain guard (ADR 0006): ignore distributions uploaded in the last 14 days.
exclude-newer = "14 days"

[tool.uv.workspace]
members = ["apps/api"]


[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["apps/web", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.pylint]
# Keyword-only options are common in the LLM layer (max_tokens, schema, metadata, ...).
max-args = 8

[tool.ruff.lint.isort]
known-first-party = ["codewright_api", "agent"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "PLR2004"]
"apps/api/migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["agent", "apps/api/src", "apps/api/tests", "evals"]
mypy_path = "apps/api/src"

[tool.pytest.ini_options]
testpaths = ["agent/tests", "connectors/tests", "apps/api/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
