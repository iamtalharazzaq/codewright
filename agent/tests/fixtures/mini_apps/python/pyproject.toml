[project]
name = "miniapp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miniapp"]

[tool.pytest.ini_options]
# "." (not just "tests"): Codewright's own test file for a source file lands next to it (own_test_file,
# agent/playbooks/code_edit.py), e.g. src/miniapp/test_core_codewright.py, not under tests/.
testpaths = ["."]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
