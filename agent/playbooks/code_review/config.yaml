# CODEWRIGHT.md Section 5.1c. Tier 0: findings only; applying fixes is a tier 1-2 change (Phase 8).
title: Code review
description: >-
  Reviews code like a senior engineer: a file, folder, module or the whole project. Linters run in the sandbox, then
