[project]
name = "monoshift-api"
version = "0.0.0"
description = "MonoShift backend API (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "monoshift[langfuse]",
    "alembic>=1.16",
    "fastapi>=0.120",
    "psycopg[binary]>=3.2",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "pyyaml>=6",
    "sqlalchemy[asyncio]>=2.0.40",
    "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = ["httpx>=0.28"]

[tool.uv.sources]
monoshift = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monoshift_api"]
