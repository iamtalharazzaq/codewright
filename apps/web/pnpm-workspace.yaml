# Supply-chain guard: only install package versions published at least 14 days ago (ADR 0006).
minimumReleaseAge: 20160
# Security exceptions to the age rule (ADR 0006): patched releases for published advisories.
#   next 16.4.1 fixes GHSA-2464-fhr4-w9xw, GHSA-673q-mjm6-r5xr (critical) and GHSA-p3m5-59mp-jv5r (high).
minimumReleaseAgeExclude:
  - next@16.4.1
  - "@next/*" # platform binaries and plugins released together with next
  - eslint-config-next@16.4.1
allowBuilds:
  sharp: false
  unrs-resolver: false
